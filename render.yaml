# NYX Backend - Render Configuration
# Deploy to: https://render.com
# 
# This configuration deploys the FastAPI backend with all required environment variables.
# API keys are injected via Render's dashboard (sync: false means manual entry).

services:
  - type: web
    name: nyx-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Python version
      - key: PYTHON_VERSION
        value: 3.12.0
      
      # LLM Provider API Keys (Feature #1: Adaptive Throttling)
      # Add your actual keys in Render Dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: SAMBA_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      
      # Database Configuration (Feature #9: Neural Tattoo / RAG)
      - key: DATABASE_URL
        sync: false
        value: sqlite:///./data/nyx.db
      - key: VECTOR_DB_URL
        sync: false
      - key: VECTOR_DB_API_KEY
        sync: false
      
      # Redis for Semantic Caching (Feature #2)
      - key: REDIS_URL
        sync: false
        value: redis://localhost:6379
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Persistent disk for simulation logs and database
    disk:
      type: persistent
      mountPath: /app/backend/data
      sizeGB: 1
